<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon"/>
    <title>Raker Countdown Timer</title>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center font-sans text-white">

    <div class="bg-gray-800 p-8 rounded-3xl shadow-2xl text-center border border-gray-700 max-w-lg w-full relative overflow-hidden">
        
        <!-- Efek cahaya latar (Kosmetik) -->
        <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-full h-1 bg-gradient-to-r from-transparent via-cyan-500 to-transparent opacity-50"></div>

        <h1 class="text-2xl font-bold mb-4 text-gray-300">Countdown Timer</h1>
        
        <!-- Jam Real-time Asia/Jakarta -->
        <div class="mb-8">
            <div id="realTimeClock" class="text-3xl font-mono font-medium text-gray-100 bg-gray-700/50 inline-block px-4 py-2 rounded-lg border border-gray-600">
                00:00:00
            </div>
        </div>
        
        <!-- Timer Display Countdown -->
        <div id="display" class="flex items-baseline justify-center font-mono font-bold mb-4 shadow-inner bg-gray-900 py-6 rounded-xl transition-colors duration-300 border border-gray-800">
            <span id="minsSecs" class="text-7xl text-cyan-400 tracking-wider">10:00</span>
            <span id="millisecs" class="text-3xl text-cyan-600 ml-1">.000</span>
        </div>
        
        <!-- Info Waktu Mulai (Akan muncul setelah klik mulai) -->
        <div id="startTimeContainer" class="h-6 mb-6 transition-opacity duration-300 opacity-0">
            <p class="text-sm text-gray-400">
                Dimulai pada: <span id="startTimeRecord" class="font-mono text-green-400 font-semibold tracking-wide"></span>
            </p>
        </div>
        
        <!-- Controls -->
        <div class="flex justify-center space-x-3">
            <button id="startBtn" class="px-6 py-3 w-28 bg-green-500 hover:bg-green-600 text-white font-semibold rounded-lg transition duration-200 transform hover:scale-105 active:scale-95 shadow-lg">
                Mulai
            </button>
            <button id="stopBtn" class="px-6 py-3 w-32 bg-yellow-500 hover:bg-yellow-600 text-white font-semibold rounded-lg transition duration-200 transform hover:scale-105 active:scale-95 shadow-lg">
                Stop
            </button>
            <button id="resetBtn" class="px-6 py-3 w-28 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-lg transition duration-200 transform hover:scale-105 active:scale-95 shadow-lg">
                Reset
            </button>
        </div>
    </div>

    <script>
        // --- 1. LOGIKA JAM REAL-TIME (ASIA/JAKARTA) ---
        const realTimeClockEl = document.getElementById('realTimeClock');
        
        function updateRealTimeClock() {
            const now = new Date();
            // Mengambil waktu khusus zona Asia/Jakarta
            const timeString = now.toLocaleTimeString('id-ID', {
                timeZone: 'Asia/Jakarta',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            }).replace(/\./g, ':'); // Mengganti format titik (.) menjadi titik dua (:)

            realTimeClockEl.textContent = timeString;
        }
        
        // Jalankan jam setiap detik
        setInterval(updateRealTimeClock, 1000);
        updateRealTimeClock(); // Panggil sekali di awal agar tidak delay 1 detik


        // --- 2. LOGIKA COUNTDOWN ---
        const TOTAL_MS = 10 * 60 * 1000; 
        let timeRemaining = TOTAL_MS;
        let expectedEndTime = 0;
        let timerFrame = null;
        let isRunning = false;
        let lastTickSecond = -1;

        // Elemen DOM Countdown
        const minsSecsEl = document.getElementById('minsSecs');
        const millisecsEl = document.getElementById('millisecs');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resetBtn = document.getElementById('resetBtn');
        const startTimeContainer = document.getElementById('startTimeContainer');
        const startTimeRecord = document.getElementById('startTimeRecord');

        // Setup Audio
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'tick') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'end') {
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.5);
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 2);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 2);
            }
        }

        function updateDisplay() {
            if (timeRemaining < 0) timeRemaining = 0;

            const totalSeconds = Math.floor(timeRemaining / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const milliseconds = timeRemaining % 1000;

            const mStr = minutes.toString().padStart(2, '0');
            const sStr = seconds.toString().padStart(2, '0');
            const msStr = milliseconds.toString().padStart(3, '0');

            minsSecsEl.textContent = `${mStr}:${sStr}`;
            millisecsEl.textContent = `.${msStr}`;
            
            if (timeRemaining <= 10000 && timeRemaining > 0) {
                minsSecsEl.classList.replace('text-cyan-400', 'text-red-500');
                millisecsEl.classList.replace('text-cyan-600', 'text-red-400');
            } else {
                minsSecsEl.classList.replace('text-red-500', 'text-cyan-400');
                millisecsEl.classList.replace('text-red-400', 'text-cyan-600');
            }
        }

        function tick() {
            if (!isRunning) return;

            const now = Date.now();
            timeRemaining = expectedEndTime - now;

            if (timeRemaining <= 0) {
                timeRemaining = 0;
                updateDisplay();
                playSound('end');
                resetStopButton(); 
                isRunning = false;
                return;
            }

            updateDisplay();

            const currentSecond = Math.ceil(timeRemaining / 1000);
            if (currentSecond <= 10 && currentSecond > 0) {
                if (lastTickSecond !== currentSecond) {
                    playSound('tick');
                    lastTickSecond = currentSecond;
                }
            }

            timerFrame = requestAnimationFrame(tick);
        }

        function resetStopButton() {
            stopBtn.textContent = "Stop";
            stopBtn.classList.remove("bg-blue-500", "hover:bg-blue-600");
            stopBtn.classList.add("bg-yellow-500", "hover:bg-yellow-600");
        }

        function setResumeButton() {
            stopBtn.textContent = "Lanjutkan";
            stopBtn.classList.remove("bg-yellow-500", "hover:bg-yellow-600");
            stopBtn.classList.add("bg-blue-500", "hover:bg-blue-600");
        }

        function startTimer() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            if (!isRunning && timeRemaining > 0) {
                // Rekam waktu mulai HANYA jika timer dimulai dari 10 menit utuh
                if (timeRemaining === TOTAL_MS) {
                    const startNow = new Date();
                    const startStr = startNow.toLocaleTimeString('id-ID', {
                        timeZone: 'Asia/Jakarta',
                        hour: '2-digit', minute: '2-digit', second: '2-digit'
                    }).replace(/\./g, ':');
                    
                    startTimeRecord.textContent = startStr;
                    startTimeContainer.classList.remove('opacity-0');
                    startTimeContainer.classList.add('opacity-100');
                }

                isRunning = true;
                expectedEndTime = Date.now() + timeRemaining;
                resetStopButton(); 
                timerFrame = requestAnimationFrame(tick);
            }
        }

        function toggleStopResume() {
            if (isRunning) {
                isRunning = false;
                cancelAnimationFrame(timerFrame);
                setResumeButton(); 
            } 
            else if (!isRunning && timeRemaining > 0 && timeRemaining < TOTAL_MS) {
                startTimer();
            }
        }

        function resetTimer() {
            isRunning = false;
            cancelAnimationFrame(timerFrame);
            timeRemaining = TOTAL_MS;
            lastTickSecond = -1; 
            
            resetStopButton();
            updateDisplay();

            // Sembunyikan dan hapus rekaman waktu mulai
            startTimeContainer.classList.remove('opacity-100');
            startTimeContainer.classList.add('opacity-0');
            setTimeout(() => { startTimeRecord.textContent = ""; }, 300);
        }

        // Event Listeners
        startBtn.addEventListener('click', startTimer);
        stopBtn.addEventListener('click', toggleStopResume);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
    </script>
</body>
</html>
